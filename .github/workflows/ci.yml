name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: Typecheck, lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Testes (Jest + cobertura)
        run: npm run test:ci

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  mudancas:
    name: Detectar mudanças no app
    # Em PR, decide se o build do APK é necessário. PRs que só mexem no banco
    # (supabase/**), na documentação ou nos workflows do banco não geram APK.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filtro.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Comparar com a base do PR
        id: filtro
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "$BASE_SHA" HEAD | tee arquivos.txt
          if grep -qvE '^(supabase/|docs/|agentes/|STATUS\.md$|README\.md$|PROMPT-APP-OFICINA\.md$|\.github/workflows/(supabase|keepalive)\.yml$)' arquivos.txt; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  android-build:
    name: Build do APK (Android)
    # Build nativo é lento: roda em push na main, manualmente e em PR para a
    # main que altere o app (ver job "mudancas").
    if: >-
      !cancelled() && needs.qualidade.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && needs.mudancas.outputs.app == 'true')
      )
    needs: [qualidade, mudancas]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Instalar dependências
        run: npm ci

      - name: Gerar projeto Android (prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compilar APK (release, assinatura debug)
        working-directory: android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Publicar APK
        uses: actions/upload-artifact@v7
        with:
          name: oficina-do-paulo-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
